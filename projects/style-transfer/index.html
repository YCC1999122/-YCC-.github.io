<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Transfer Studio / 风格迁移工作室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f0b1e;
    color: #e8e4f5;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: -10%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px;
    position: relative;
    z-index: 1;
  }

  /* 顶部导航 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #b8b0d0;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .back-btn:hover {
    background: rgba(139, 92, 246, 0.15);
    border-color: rgba(139, 92, 246, 0.4);
    color: #fff;
    transform: translateX(-3px);
  }
  .back-btn svg { width: 16px; height: 16px; }

  .page-title {
    text-align: center;
    flex: 1;
  }
  .page-title h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
  }
  .page-title p {
    font-size: 13px;
    color: #7a7294;
    margin-top: 4px;
  }

  .header-spacer { width: 110px; }

  /* 主内容区 */
  .main-content {
    display: grid;
    grid-template-columns: 1fr 120px 1fr;
    gap: 30px;
    align-items: start;
    margin-bottom: 30px;
  }

  /* 卡片通用样式 */
  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #d4ccee;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #ec4899);
  }

  /* 左侧上传区域 */
  .upload-zone {
    border: 2px dashed rgba(167, 139, 250, 0.4);
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(167, 139, 250, 0.03);
    margin-bottom: 20px;
  }
  .upload-zone:hover {
    border-color: rgba(236, 72, 153, 0.6);
    background: rgba(236, 72, 153, 0.05);
    transform: translateY(-2px);
  }
  .upload-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(236, 72, 153, 0.2));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-icon svg {
    width: 28px;
    height: 28px;
    color: #c4b5fd;
  }
  .upload-zone h3 {
    font-size: 15px;
    font-weight: 600;
    color: #e8e4f5;
    margin-bottom: 6px;
  }
  .upload-zone p {
    font-size: 12px;
    color: #7a7294;
  }

  /* 示例原图 */
  .sample-image {
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #1a1530 0%, #2d1f4a 100%);
  }
  .sample-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .sample-label {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    font-size: 11px;
    color: #c4b5fd;
  }

  /* 中间箭头区域 */
  .arrow-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 100px;
    gap: 20px;
  }
  .arrow-circle {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4); }
    50% { box-shadow: 0 8px 48px rgba(236, 72, 153, 0.6); }
  }
  .arrow-circle svg {
    width: 30px;
    height: 30px;
    color: white;
  }
  .style-transfer-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #a78bfa 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* 右侧风格选择 */
  .style-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .style-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    aspect-ratio: 1;
  }
  .style-item:hover {
    transform: translateY(-3px);
  }
  .style-item.active {
    border-color: #ec4899;
    box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
  }
  .style-item svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .style-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 6px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    font-size: 11px;
    color: #fff;
    text-align: center;
    font-weight: 500;
  }
  .style-item.active .style-name::before {
    content: '';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 18px;
    height: 18px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .style-item.active .style-name::after {
    content: '✓';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: bold;
  }

  /* 底部控制区 */
  .controls-section {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }

  /* 滑块控件 */
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .slider-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slider-label {
    font-size: 13px;
    color: #c4bcda;
    font-weight: 500;
  }
  .slider-value {
    font-size: 12px;
    color: #a78bfa;
    font-weight: 600;
    padding: 2px 8px;
    background: rgba(167, 139, 250, 0.1);
    border-radius: 6px;
  }
  .slider-track {
    position: relative;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .slider-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    border-radius: 3px;
  }
  .slider-thumb {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(139, 92, 246, 0.5);
    cursor: pointer;
  }

  /* 开始按钮 */
  .start-btn-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 18px 36px;
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
    letter-spacing: 2px;
  }
  .start-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(236, 72, 153, 0.5);
  }
  .start-btn:active {
    transform: translateY(-1px);
  }
  .start-btn svg {
    width: 20px;
    height: 20px;
  }

  /* 右下角预览框 */
  .preview-panel {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 300px;
    background: rgba(20, 15, 40, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 18px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    z-index: 10;
  }
  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .preview-title {
    font-size: 13px;
    font-weight: 600;
    color: #e8e4f5;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preview-title .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .preview-close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #7a7294;
    font-size: 14px;
    transition: all 0.2s ease;
  }
  .preview-close:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
  .preview-image {
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #2d1f4a, #4a1f3a);
    position: relative;
  }
  .preview-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .preview-meta {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .preview-style {
    font-size: 12px;
    color: #a78bfa;
    font-weight: 500;
  }
  .preview-time {
    font-size: 11px;
    color: #7a7294;
  }
  .preview-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .preview-action-btn {
    flex: 1;
    padding: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    color: #c4bcda;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .preview-action-btn:hover {
    background: rgba(167, 139, 250, 0.15);
    border-color: rgba(167, 139, 250, 0.3);
    color: #fff;
  }
  .preview-action-btn svg {
    width: 13px;
    height: 13px;
  }

  /* 响应式 */
  @media (max-width: 1100px) {
    .main-content {
      grid-template-columns: 1fr;
    }
    .arrow-section {
      padding-top: 0;
      flex-direction: row;
    }
    .style-transfer-text {
      writing-mode: horizontal-tb;
    }
    .controls-section {
      grid-template-columns: 1fr;
    }
    .preview-panel {
      position: static;
      width: 100%;
      margin-top: 20px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <!-- 顶部 -->
    <div class="header">
      <a href="../../index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回主页
      </a>
      <div class="page-title">
        <h1>Style Transfer Studio</h1>
        <p>风格迁移工作室 · 让你的照片拥有艺术灵魂</p>
      </div>
      <div class="header-spacer"></div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
      <!-- 左侧：上传区域 -->
      <div class="card">
        <div class="card-title">
          <span class="dot"></span>
          上传原图
        </div>
        <div class="upload-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <h3>点击或拖拽上传图片</h3>
          <p>支持 JPG / PNG / WEBP · 最大 10MB</p>
        </div>
        <div class="card-title" style="margin-top: 8px;">
          <span class="dot"></span>
          示例原图
        </div>
        <div class="sample-image">
          <span class="sample-label">风景照片</span>
          <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
            <!-- 天空 -->
            <defs>
              <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#87ceeb"/>
                <stop offset="100%" style="stop-color:#e0f7fa"/>
              </linearGradient>
              <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#6b8e9e"/>
                <stop offset="100%" style="stop-color:#4a6675"/>
              </linearGradient>
              <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#8aa5b3"/>
                <stop offset="100%" style="stop-color:#6b8e9e"/>
              </linearGradient>
              <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#4fc3f7"/>
                <stop offset="100%" style="stop-color:#0288d1"/>
              </linearGradient>
            </defs>
            <rect width="400" height="300" fill="url(#skyGrad)"/>
            <!-- 太阳 -->
            <circle cx="320" cy="60" r="35" fill="#ffeb3b" opacity="0.9"/>
            <!-- 云朵 -->
            <ellipse cx="80" cy="50" rx="40" ry="15" fill="white" opacity="0.8"/>
            <ellipse cx="100" cy="45" rx="30" ry="12" fill="white" opacity="0.8"/>
            <ellipse cx="250" cy="40" rx="35" ry="12" fill="white" opacity="0.7"/>
            <!-- 远山 -->
            <polygon points="0,180 80,100 160,160 240,90 320,150 400,110 400,300 0,300" fill="url(#mountainGrad2)" opacity="0.6"/>
            <!-- 近山 -->
            <polygon points="0,220 60,140 140,200 220,130 300,190 380,140 400,170 400,300 0,300" fill="url(#mountainGrad1)"/>
            <!-- 水面 -->
            <rect x="0" y="230" width="400" height="70" fill="url(#waterGrad)"/>
            <!-- 水面波纹 -->
            <path d="M0,245 Q50,240 100,245 T200,245 T300,245 T400,245" stroke="white" stroke-width="1" fill="none" opacity="0.3"/>
            <path d="M0,260 Q50,255 100,260 T200,260 T300,260 T400,260" stroke="white" stroke-width="1" fill="none" opacity="0.2"/>
            <path d="M0,275 Q50,270 100,275 T200,275 T300,275 T400,275" stroke="white" stroke-width="1" fill="none" opacity="0.2"/>
            <!-- 小船 -->
            <path d="M170,245 L200,245 L195,255 L175,255 Z" fill="#5d4037"/>
            <line x1="185" y1="245" x2="185" y2="225" stroke="#5d4037" stroke-width="2"/>
            <path d="M185,225 L200,235 L185,240 Z" fill="#fff"/>
            <!-- 树 -->
            <rect x="45" y="200" width="6" height="30" fill="#5d4037"/>
            <circle cx="48" cy="195" r="15" fill="#2e7d32"/>
            <circle cx="42" cy="200" r="10" fill="#388e3c"/>
            <circle cx="55" cy="198" r="10" fill="#388e3c"/>
            <rect x="350" y="205" width="5" height="25" fill="#5d4037"/>
            <circle cx="352" cy="200" r="12" fill="#2e7d32"/>
          </svg>
        </div>
      </div>

      <!-- 中间：箭头 -->
      <div class="arrow-section">
        <div class="arrow-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
        <div class="style-transfer-text">STYLE TRANSFER</div>
      </div>

      <!-- 右侧：风格选择 -->
      <div class="card">
        <div class="card-title">
          <span class="dot"></span>
          选择风格
        </div>
        <div class="style-grid">
          <!-- 梵高星空 -->
          <div class="style-item active">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="vg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#1a237e"/>
                  <stop offset="100%" style="stop-color:#4a148c"/>
                </linearGradient>
              </defs>
              <rect width="200" height="200" fill="url(#vg-bg)"/>
              <!-- 漩涡星星 -->
              <circle cx="50" cy="40" r="12" fill="#ffeb3b" opacity="0.9"/>
              <circle cx="140" cy="30" r="8" fill="#fff176" opacity="0.8"/>
              <circle cx="170" cy="70" r="10" fill="#ffee58" opacity="0.9"/>
              <circle cx="30" cy="90" r="6" fill="#fff9c4" opacity="0.7"/>
              <!-- 漩涡线条 -->
              <path d="M0,120 Q50,100 70,120 T140,120 T200,110" stroke="#7986cb" stroke-width="4" fill="none" opacity="0.6"/>
              <path d="M0,140 Q60,120 80,140 T160,140 T200,130" stroke="#5c6bc0" stroke-width="3" fill="none" opacity="0.5"/>
              <path d="M0,160 Q40,140 80,160 T160,160 T200,150" stroke="#3f51b5" stroke-width="4" fill="none" opacity="0.6"/>
              <!-- 月亮 -->
              <circle cx="160" cy="50" r="18" fill="#fff59d" opacity="0.7"/>
              <circle cx="155" cy="45" r="15" fill="#1a237e"/>
              <!-- 柏树 -->
              <path d="M80,200 L80,130 Q75,110 85,90 Q90,70 80,50 Q85,70 90,90 Q100,110 90,130 L90,200 Z" fill="#1b5e20" opacity="0.8"/>
              <!-- 村庄 -->
              <rect x="120" y="170" width="15" height="20" fill="#bf360c"/>
              <polygon points="117,170 138,170 127,155" fill="#3e2723"/>
              <rect x="145" y="175" width="12" height="15" fill="#e64a19"/>
              <polygon points="142,175 160,175 151,163" fill="#4e342e"/>
              <rect x="165" y="172" width="18" height="18" fill="#d84315"/>
              <polygon points="162,172 186,172 174,158" fill="#3e2723"/>
            </svg>
            <div class="style-name">梵高星空</div>
          </div>

          <!-- 浮世绘 -->
          <div class="style-item">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="ukiyo-sky" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#ef5350"/>
                  <stop offset="50%" style="stop-color:#ff8a65"/>
                  <stop offset="100%" style="stop-color:#fff3e0"/>
                </linearGradient>
              </defs>
              <rect width="200" height="200" fill="url(#ukiyo-sky)"/>
              <!-- 太阳 -->
              <circle cx="100" cy="70" r="30" fill="#ffeb3b" opacity="0.9"/>
              <!-- 富士山 -->
