<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">页面开发 / Web Page Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8f9fc;
    color: #1a1a2e;
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #6366f1;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 32px;
    transition: all 0.3s ease;
  }
  .back-link:hover {
    color: #4f46e5;
    transform: translateX(-3px);
  }

  .header {
    text-align: center;
    margin-bottom: 56px;
  }
  .main-title {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: #6b7280;
    font-weight: 400;
  }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 28px;
    margin-bottom: 56px;
  }

  .project-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(99, 102, 241, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .project-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 40px rgba(139, 92, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.06);
  }

  .card-cover {
    height: 180px;
    background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-cover svg {
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 4px 12px rgba(139, 92, 246, 0.2));
  }

  .card-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .status-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 12px;
    align-self: flex-start;
  }
  .status-exploring {
    background: rgba(99, 102, 241, 0.1);
    color: #6366f1;
  }
  .status-idea {
    background: rgba(245, 158, 11, 0.1);
    color: #d97706;
  }
  .status-validated {
    background: rgba(16, 185, 129, 0.1);
    color: #059669;
  }

  .project-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 8px;
  }
  .project-desc {
    font-size: 0.9rem;
    color: #6b7280;
    margin-bottom: 16px;
    flex: 1;
  }

  .tech-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .tech-tag {
    padding: 3px 10px;
    background: rgba(139, 92, 246, 0.1);
    color: #7c3aed;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }

  .view-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    align-self: flex-start;
  }
  .view-btn:hover {
    transform: translateX(3px);
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
  }

  .more-hint {
    text-align: center;
    padding: 32px 0;
    color: #9ca3af;
    font-size: 0.9rem;
    font-style: italic;
  }
  .more-hint::before,
  .more-hint::after {
    content: '';
    display: inline-block;
    width: 30px;
    height: 1px;
    background: #e5e7eb;
    vertical-align: middle;
    margin: 0 12px;
  }

  @media (max-width: 640px) {
    .container { padding: 24px 16px; }
    .header { margin-bottom: 40px; }
    .project-grid { gap: 20px; }
    .card-cover { height: 150px; }
    .card-cover svg { width: 90px; height: 90px; }
  }
</style>
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link" data-i18n="backHome">← 返回首页</a>

    <header class="header">
      <h1 class="main-title" data-i18n="categoryTitle">页面开发</h1>
      <p class="subtitle" data-i18n="categorySubtitle">Web Page Dev · 精美页面模板，开箱即用的设计方案</p>
    </header>

    <div class="project-grid">
      <!-- Page 1: Dashboard -->
      <article class="project-card">
        <div class="card-cover">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sidebar -->
            <rect x="10" y="15" width="25" height="90" rx="4" fill="#1e1b4b" opacity="0.9"/>
            <rect x="15" y="22" width="15" height="3" rx="1" fill="#fff" opacity="0.8"/>
            <rect x="15" y="30" width="12" height="2" rx="1" fill="#fff" opacity="0.4"/>
            <rect x="15" y="35" width="10" height="2" rx="1" fill="#fff" opacity="0.4"/>
            <rect x="15" y="40" width="14" height="2" rx="1" fill="#fff" opacity="0.4"/>
            <rect x="15" y="45" width="11" height="2" rx="1" fill="#fff" opacity="0.4"/>
            <circle cx="20" cy="95" r="4" fill="#8b5cf6"/>
            <rect x="26" y="93" width="7" height="4" rx="1" fill="#fff" opacity="0.6"/>
            <!-- Main content -->
            <rect x="40" y="15" width="70" height="90" rx="4" fill="#f8fafc"/>
            <!-- Header -->
            <rect x="45" y="20" width="35" height="4" rx="2" fill="#1e293b" opacity="0.2"/>
            <circle cx="105" cy="22" r="3" fill="#8b5cf6" opacity="0.6"/>
            <!-- Stats cards -->
            <rect x="45" y="30" width="20" height="15" rx="3" fill="#e0e7ff"/>
            <rect x="47" y="34" width="10" height="2" rx="1" fill="#6366f1"/>
            <rect x="47" y="39" width="14" height="3" rx="1" fill="#1e293b" opacity="0.3"/>
            <rect x="68" y="30" width="20" height="15" rx="3" fill="#d1fae5"/>
            <rect x="70" y="34" width="10" height="2" rx="1" fill="#10b981"/>
            <rect x="70" y="39" width="14" height="3" rx="1" fill="#1e293b" opacity="0.3"/>
            <rect x="91" y="30" width="15" height="15" rx="3" fill="#fef3c7"/>
            <rect x="93" y="34" width="8" height="2" rx="1" fill="#f59e0b"/>
            <rect x="93" y="39" width="10" height="3" rx="1" fill="#1e293b" opacity="0.3"/>
            <!-- Chart -->
            <rect x="45" y="50" width="65" height="25" rx="3" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
            <polyline points="48,70 58,60 68,65 78,55 88,58 98,50 108,55" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
            <path d="M48 70 L58 60 L68 65 L78 55 L88 58 L98 50 L108 55 L108 75 L48 75 Z" fill="#8b5cf6" opacity="0.1"/>
            <!-- Table snippet -->
            <rect x="45" y="80" width="65" height="22" rx="3" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
            <rect x="48" y="84" width="20" height="2" rx="1" fill="#e5e7eb"/>
            <rect x="72" y="84" width="15" height="2" rx="1" fill="#e5e7eb"/>
            <rect x="90" y="84" width="18" height="2" rx="1" fill="#e5e7eb"/>
            <line x1="45" y1="88" x2="110" y2="88" stroke="#f1f5f9" stroke-width="0.5"/>
            <circle cx="50" cy="93" r="2" fill="#10b981" opacity="0.5"/>
            <rect x="55" y="92" width="18" height="2" rx="1" fill="#94a3b8"/>
            <rect x="76" y="92" width="12" height="2" rx="1" fill="#cbd5e1"/>
            <rect x="92" y="92" width="15" height="2" rx="1" fill="#cbd5e1"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="status-tag status-exploring" data-i18n="statusExploring">探索中</span>
          <h3 class="project-name" data-i18n="page1Name">仪表盘模板</h3>
          <p class="project-desc" data-i18n="page1Desc">数据管理后台仪表盘，图表、表格、侧边栏导航</p>
          <div class="tech-tags">
            <span class="tech-tag">Dashboard</span>
            <span class="tech-tag">Charts</span>
            <span class="tech-tag">Admin</span>
          </div>
          <a href="page-1/index.html" class="view-btn" data-i18n="viewDetails">查看详情 →</a>
        </div>
      </article>

      <!-- Page 2: E-commerce -->
      <article class="project-card">
        <div class="card-cover" style="background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%);">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Product image area -->
            <rect x="15" y="18" width="45" height="55" rx="6" fill="url(#prodGrad)"/>
            <defs>
              <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ec4899"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle cx="37" cy="45" r="15" fill="#fff" opacity="0.3"/>
            <ellipse cx="37" cy="55" rx="20" ry="5" fill="#1a1a2e" opacity="0.1"/>
            <!-- Thumbnails -->
            <rect x="15" y="78" width="10" height="10" rx="2" fill="#ec4899" opacity="0.6"/>
            <rect x="27" y="78" width="10" height="10" rx="2" fill="#8b5cf6" opacity="0.6"/>
            <rect x="39" y="78" width="10" height="10" rx="2" fill="#f59e0b" opacity="0.6"/>
            <rect x="51" y="78" width="9" height="10" rx="2" fill="#10b981" opacity="0.6"/>
            <!-- Product info -->
            <text x="67" y="28" font-family="Inter, sans-serif" font-size="8" fill="#6b7280">Brand Name</text>
            <text x="67" y="38" font-family="Inter, sans-serif" font-size="10" fill="#1a1a2e" font-weight="700">Product</text>
            <text x="67" y="48" font-family="Inter, sans-serif" font-size="11" fill="#ef4444" font-weight="700">$99.00</text>
            <text x="95" y="48" font-family="Inter, sans-serif" font-size="7" fill="#9ca3af" text-decoration="line-through">$149.00</text>
            <!-- Rating -->
            <circle cx="69" cy="55" r="2" fill="#f59e0b"/>
            <circle cx="74" cy="55" r="2" fill="#f59e0b"/>
            <circle cx="79" cy="55" r="2" fill="#f59e0b"/>
            <circle cx="84" cy="55" r="2" fill="#f59e0b"/>
            <circle cx="89" cy="55" r="2" fill="#e5e7eb"/>
            <text x="95" y="57" font-family="Inter, sans-serif" font-size="6" fill="#6b7280">(128)</text>
            <!-- Size selector -->
            <text x="67" y="68" font-family="Inter, sans-serif" font-size="6" fill="#6b7280" font-weight="600">SIZE</text>
            <rect x="67" y="72" width="10" height="10" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
            <text x="70" y="79" font-family="Inter, sans-serif" font-size="6" fill="#6b7280" text-anchor="middle">S</text>
            <rect x="79" y="72" width="10" height="10" rx="2" fill="#8b5cf6"/>
            <text x="84" y="79" font-family="Inter, sans-serif" font-size="6" fill="#fff" text-anchor="middle" font-weight="600">M</text>
            <rect x="91" y="72" width="10" height="10" rx="2" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
            <text x="96" y="79" font-family="Inter, sans-serif" font-size="6" fill="#6b7280" text-anchor="middle">L</text>
            <!-- Buy button -->
            <rect x="67" y="88" width="42" height="12" rx="6" fill="#8b5cf6"/>
            <text x="88" y="96" font-family="Inter, sans-serif" font-size="7" fill="#fff" text-anchor="middle" font-weight="600">Add to Cart</text>
            <!-- Reviews section -->
            <rect x="15" y="95" width="95" height="12" rx="3" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
            <circle cx="20" cy="101" r="3" fill="#ec4899"/>
            <rect x="26" y="98" width="30" height="2" rx="1" fill="#1a1a2e" opacity="0.3"/>
            <rect x="26" y="102" width="45" height="2" rx="1" fill="#9ca3af" opacity="0.5"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="status-tag status-idea" data-i18n="statusIdea">想法阶段</span>
          <h3 class="project-name" data-i18n="page2Name">电商产品页</h3>
          <p class="project-desc" data-i18n="page2Desc">商品展示详情页，图片轮播、规格选择、评论区</p>
          <div class="tech-tags">
            <span class="tech-tag">E-commerce</span>
            <span class="tech-tag">Product</span>
            <span class="tech-tag">UI</span>
          </div>
          <a href="page-2/index.html" class="view-btn" data-i18n="viewDetails">查看详情 →</a>
        </div>
      </article>

      <!-- Page 3: Blog -->
      <article class="project-card">
        <div class="card-cover" style="background: linear-gradient(135deg, #e0e7ff 0%, #f8f9fc 100%);">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Header -->
            <text x="15" y="28" font-family="Inter, serif" font-size="12" fill="#1a1a2e" font-weight="700">My Blog</text>
            <rect x="75" y="20" width="15" height="3" rx="1.5" fill="#6b7280" opacity="0.4"/>
            <rect x="93" y="20" width="12" height="3" rx="1.5" fill="#6b7280" opacity="0.4"/>
            <line x1="15" y1="35" x2="105" y2="35" stroke="#e5e7eb" stroke-width="0.5"/>
            <!-- Post 1 -->
            <rect x="15" y="42" width="65" height="5" rx="2" fill="#1a1a2e" opacity="0.8"/>
            <rect x="15" y="50" width="50" height="3" rx="1.5" fill="#9ca3af"/>

            <rect x="33" y="66" width="12" height="6" rx="3" fill="#fce7f3"/>
            <text x="39" y="70" font-family="Inter, sans-serif" font-size="4" fill="#ec4899" text-anchor="middle" font-weight="500">Code</text>
            <line x1="15" y1="78" x2="105" y2="78" stroke="#f3f4f6" stroke-width="0.5"/>

            <rect x="15" y="84" width="55" height="5" rx="2" fill="#1a1a2e" opacity="0.7"/>
            <rect x="15" y="92" width="45" height="3" rx="1.5" fill="#9ca3af"/>

            <rect x="15" y="102" width="55" height="2" rx="1" fill="#f3f4f6"/>
            <!-- Sidebar -->
            <rect x="88" y="42" width="22" height="25" rx="4" fill="#f8fafc" stroke="#e5e7eb" stroke-width="0.5"/>
            <circle cx="99" cy="50" r="5" fill="#8b5cf6" opacity="0.7"/>
            <text x="99" y="60" font-family="Inter, sans-serif" font-size="5" fill="#1a1a2e" text-anchor="middle" font-weight="600">Author</text>
            <rect x="92" y="63" width="14" height="2" rx="1" fill="#d1d5db"/>
            <!-- Tags cloud -->
            <rect x="88" y="72" width="22" height="20" rx="4" fill="#f8fafc" stroke="#e5e7eb" stroke-width="0.5"/>
            <text x="92" y="79" font-family="Inter, sans-serif" font-size="4" fill="#6b7280" font-weight="600">Tags</text>
            <rect x="91" y="83" width="8" height="5" rx="2" fill="#e0e7ff"/>
            <rect x="101" y="83" width="7" height="5" rx="2" fill="#fce7f3"/>
            <rect x="91" y="89" width="6" height="5" rx="2" fill="#d1fae5"/>
            <rect x="99" y="89" width="9" height="5" rx="2" fill="#fef3c7"/>

        </div>
        <div class="card-body">
          <span class="status-tag status-validated" data-i18n="statusValidated">已验证</span>
          <h3 class="project-name" data-i18n="page3Name">个人博客模板</h3>
          <p class="project-desc" data-i18n="page3Desc">极简风格博客，文章列表、标签、归档</p>
          <div class="tech-tags">
            <span class="tech-tag">Blog</span>
            <span class="tech-tag">Minimal</span>
            <span class="tech-tag">Template</span>
          </div>
          <a href="page-3/index.html" class="view-btn" data-i18n="viewDetails">查看详情 →</a>
        </div>
      </article>
    </div>

    <div class="more-hint" data-i18n="moreHint">更多创意孵化中...</div>
  </div>
</body>
</html>
